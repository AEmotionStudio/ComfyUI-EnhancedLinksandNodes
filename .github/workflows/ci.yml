name: CI

on:
  pull_request:
  push:
    branches: [main, v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p tests/e2e
      - run: pnpm exec vite build
      # Staging the fresh build first catches new and removed files, not just changed ones.
      - run: git add --all -- js/ && git diff --cached --exit-code -- js/
      - run: pnpm exec vitest run
      - run: pnpm exec knip
