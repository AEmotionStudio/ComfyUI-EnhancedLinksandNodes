name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  # The checks ci.yml runs, so a release never publishes a build that fails them.
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p tests/e2e
      - run: pnpm exec vite build
      # Staging the fresh build first catches new and removed files, not just changed ones.
      - run: git add --all -- js/ && git diff --cached --exit-code -- js/
      - run: pnpm exec vitest run
      - run: pnpm exec knip

  publish-node:
    name: Publish Custom Node to registry
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'AEmotionStudio' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
