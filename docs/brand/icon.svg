  </defs>
  <rect width="400" height="400" rx="88" fill="url(#bg)"/>
  <g transform="translate(56 56) scale(12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#link)" stroke-width="2.4" opacity="0.7" filter="url(#glow)">
